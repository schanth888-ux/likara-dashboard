# Supabase project config for Likara AI.
# Full deploy/cron wiring instructions: docs/03-deployment-guide.md

project_id = "likara-ai"

[functions.lease-summarizer]
verify_jwt = true

[functions.maintenance-triage]
verify_jwt = true

[functions.smart-search]
verify_jwt = true

[functions.generate-monthly-report]
verify_jwt = true

[functions.universal-importer-extract]
verify_jwt = true

# Cron-invoked functions run with verify_jwt = false and are instead protected
# by a shared secret header (CRON_SECRET) checked at the top of the function,
# OR invoked via `supabase functions schedule` which signs requests internally.
[functions.anomaly-detection-cron]
verify_jwt = false

[functions.district-performance-score]
verify_jwt = false

# ----------------------------------------------------------------------------
# Cron schedules (pg_cron via Supabase Scheduled Triggers, HKT = UTC+8).
# 09:00 Asia/Hong_Kong == 01:00 UTC. Apply via SQL (run once after functions
# are deployed) — see sql/003_cron_schedules.sql for the exact statements,
# since `supabase/config.toml` does not itself execute pg_cron jobs; it only
# documents intent here for readability.
# ----------------------------------------------------------------------------
# 01:00 UTC daily -> anomaly-detection-cron       (09:00 HKT)
# 01:15 UTC daily -> district-performance-score   (09:15 HKT, runs after anomalies)
